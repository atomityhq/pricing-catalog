name: Private Evaluation

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Evaluation task ID"
        required: true
        type: string
      ref:
        description: "Candidate branch, tag, or commit SHA"
        required: true
        type: string

permissions:
  contents: read

jobs:
  evaluate:
    name: Evaluate candidate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare private evaluation data
        env:
          PRIVATE_EVAL_DATA: ${{ secrets.PRIVATE_EVAL_DATA }}
        run: |
          set -euo pipefail

          test -n "$PRIVATE_EVAL_DATA"

          rm -rf "$RUNNER_TEMP/private-eval"
          mkdir -p "$RUNNER_TEMP/private-eval"

          printf '%s' "$PRIVATE_EVAL_DATA" \
            | base64 --decode \
            | tar -xzf - -C "$RUNNER_TEMP/private-eval"

          echo "Private evaluation files:"
          find "$RUNNER_TEMP/private-eval" -maxdepth 4 -type f -print

      - name: Generate maintainer evaluation harness
        run: |
          set -euo pipefail

          mkdir -p .evaluation-harness

          cat > .evaluation-harness/main.go <<'EOF'
          package main

          import (
              "context"
              "fmt"
              "io"
              "os"
              "path/filepath"
              "time"

              cloudservers "pricing-catalog/connectors/hetzner/cloud-servers"
              "pricing-catalog/internal/evaluation/cases"
              "pricing-catalog/internal/evaluation/runner"
              "pricing-catalog/internal/evaluation/scoring"
              "pricing-catalog/internal/pipeline"
              "pricing-catalog/pkg/connector"
          )

          func main() {
              evalDir := os.Getenv("PRIVATE_EVAL_DIR")

              casesPath := filepath.Join(
                  evalDir,
                  "hetzner-cloud-servers",
                  "cases.yaml",
              )

              file, err := os.Open(casesPath)
              if err != nil {
                  panic(err)
              }
              defer file.Close()

              suite, err := cases.Load(file)
              if err != nil {
                  panic(err)
              }

              fixtureDir := filepath.Join(
                  evalDir,
                  "hetzner-cloud-servers",
                  "fixtures",
              )

              results, err := runner.RunSuite(
                  context.Background(),
                  suite,
                  fixtureDir,
                  func(r io.Reader) connector.Connector {
                      return cloudservers.New(r)
                  },
                  pipeline.BuildOptions{
                      Version:     "private-evaluation",
                      GeneratedAt: time.Now().UTC(),
                  },
              )
              if err != nil {
                  panic(err)
              }

              report := scoring.Score(results)

              for _, result := range results {
                  if result.Passed {
                      fmt.Printf("PASS %s\n", result.CaseID)
                  } else {
                      fmt.Printf("FAIL %s: %v\n", result.CaseID, result.Error)
                  }
              }

              fmt.Printf(
                  "Automated score: %d/%d (%.1f%%)\n",
                  report.Passed,
                  report.Total,
                  report.Score,
              )

              if report.Failed > 0 {
                  os.Exit(1)
              }
          }
          EOF

      - name: Validate private evaluation data
        run: |
          set -euo pipefail

          test -f "$RUNNER_TEMP/private-eval/hetzner-cloud-servers/cases.yaml"
          test -f "$RUNNER_TEMP/private-eval/hetzner-cloud-servers/fixtures/pricing.json"

      - name: Run private evaluation
        env:
          PRIVATE_EVAL_DIR: ${{ runner.temp }}/private-eval
        run: |
           set -euo pipefail
           go run ./.evaluation-harness


      - name: Remove private evaluation data
        if: always()
        run: |
          rm -rf .evaluation-harness