name: Private Evaluation

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Evaluation task ID"
        required: true
        type: string
      ref:
        description: "Candidate branch, tag, or commit SHA"
        required: true
        type: string

permissions:
  contents: read

jobs:
  evaluate:
    name: Evaluate candidate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare private evaluation data
        env:
          PRIVATE_EVAL_DATA: ${{ secrets.PRIVATE_EVAL_DATA }}
        run: |
          set -euo pipefail

          test -n "$PRIVATE_EVAL_DATA"

          rm -rf "$RUNNER_TEMP/private-eval"
          mkdir -p "$RUNNER_TEMP/private-eval"

          printf '%s' "$PRIVATE_EVAL_DATA" \
            | base64 --decode \
            | tar -xzf - -C "$RUNNER_TEMP/private-eval"

          echo "Private evaluation files:"
          find "$RUNNER_TEMP/private-eval" -maxdepth 4 -type f -print

      - name: Generate maintainer evaluation harness
        env:
          PRIVATE_EVAL_DIR: ${{ runner.temp }}/private-eval
          TASK: ${{ inputs.task }}
        run: |
          set -euo pipefail

          test -f "$PRIVATE_EVAL_DIR/$TASK/evaluator.go"

          mkdir -p .evaluation-harness
          cp "$PRIVATE_EVAL_DIR/$TASK/evaluator.go" \
            .evaluation-harness/main.go

      - name: Validate private evaluation data
        env:
          TASK: ${{ inputs.task }}
        run: |
          set -euo pipefail

          test -f "$RUNNER_TEMP/private-eval/$TASK/cases.yaml"
          test -d "$RUNNER_TEMP/private-eval/$TASK/fixtures"
          test -f "$RUNNER_TEMP/private-eval/$TASK/evaluator.go"

      - name: Run private evaluation
        env:
          PRIVATE_EVAL_DIR: ${{ runner.temp }}/private-eval
        run: |
          set -euo pipefail
          go run ./.evaluation-harness


      - name: Remove private evaluation data
        if: always()
        run: |
          rm -rf .evaluation-harness